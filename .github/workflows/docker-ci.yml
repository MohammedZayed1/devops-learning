name: Docker CI - Project 08

on:
  push:
    branches:
      - main
      - "feature/**"

  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: devops-learning/Docker/project-08-ci-cd/app/package-lock.json

      - name: Install dependencies
        working-directory: devops-learning/Docker/project-08-ci-cd/app
        run: npm ci

      - name: Run tests
        working-directory: devops-learning/Docker/project-08-ci-cd/app
        run: npm test

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t devops-ci-cd-demo:${{ github.sha }} \
            devops-learning/Docker/project-08-ci-cd/app
